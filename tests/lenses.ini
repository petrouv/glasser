# glasser test database, read by run-tests.sh (GLASSER_LENS_DB).
# The lenses are real; serial numbers and generations are made up. Tests
# depend on the set and the order: change this together with run-tests.sh.
#
# glasser lens database: one [id] section per lens.
#
#   [id]           — id for --lens and --list-lenses (unique, no spaces)
#   make           — manufacturer (LensMake)
#   model          — model without the brand (LensModel)
#   display        — full name with the brand: menus, cards, XMP-aux:Lens
#   focal          — focal length, mm
#   max, min       — maximum and minimum aperture (f-numbers)
#   serial         — serial number; optional
#   lens_string    — short form for Nikon:Lens, e.g. 58mm f/1.9
#   generation     — revision marker for the menu (II, M-4, white); not
#                    written to EXIF; optional
#
# The value is everything after the first "=", trimmed at both ends.
# Lines starting with "#" and empty lines are skipped; a "#" in the
# middle of a line is part of the value.

# The only 58 mm lens: samples/Nikon + Primoplan (58/1.9) is guessed as it.
[biotar-58]
make        = Carl Zeiss Jena
model       = Biotar 58mm f/2
display     = Carl Zeiss Jena Biotar 58mm f/2
focal       = 58
max         = 2
min         = 16
serial      = 4471395
lens_string = 58mm f/2
generation  = T

# The only 57 mm lens: samples/Fuji + Konica (57/1.2) is guessed as it.
[hexanon-57-14]
